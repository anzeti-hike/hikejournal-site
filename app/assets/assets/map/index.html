<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HikeJournal – zemljevid</title>
<link rel="stylesheet" href="maplibre-gl.css?v=20261105105053">
<style>
  html, body, #map { margin: 0; height: 100%; width: 100%; background: #cfdbe3; overflow: hidden; }
  body { font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .pin { display: flex; align-items: baseline; gap: 6px; padding: 5px 9px; border-radius: 9px; background: #14181b; color: #fff;
         font: 700 14px system-ui, sans-serif; box-shadow: 0 3px 10px rgba(0,0,0,.3); white-space: nowrap; pointer-events: none; }
  .pin i { font-style: normal; font-weight: 600; color: #d6dbdf; }
  .lowzoom .pin, .lowzoom .media-pin { display: none; }
  .nopeaks .pin { display: none; }
  .media-pin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff; background: #2563eb; color: #fff; font-size: 10px;
               cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.35); display: grid; place-items: center; padding: 0; }
  .maplibregl-ctrl-attrib { font-size: 11px; }
  #err { position: absolute; inset: auto 12px 12px 12px; background: #14181b; color: #fff; padding: 10px 14px; border-radius: 10px; font: 14px system-ui; display: none; }
</style>
</head>
<body>
<div id="map"></div>
<div id="err"></div>
<script src="maplibre-gl.js?v=20261105105053"></script>
<script src="world.js?v=20261105105053"></script>
